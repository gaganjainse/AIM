name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit pip-audit flake8

      - name: Security — bandit (documented exclusions, no suppression)
        run: bandit -r . -c bandit.yaml -ll

      - name: Security — pip-audit (keyless, OSV/PyPI)
        run: pip-audit -r requirements.txt

      - name: Lint — flake8 (critical errors only)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,__pycache__,demo

      - name: Syntax — compile every file
        run: python -m py_compile $(git ls-files '*.py')

      - name: Test
        run: python -m pytest tests/ -v --tb=short -x
